on:
    pull_request:
        branches:
            - main
        types: ["closed"]

permissions:
    contents: write
    pull-requests: write

jobs:
    cherry_pick_release_0_1_x:
        runs-on: ubuntu-latest
        name: Cherry pick into release/0.1.x
        if: ${{ contains(github.event.pull_request.labels.*.name, 'release/0.1.x') && github.event.pull_request.merged == true }}
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned commit SHA
              with:
                  fetch-depth: 0
                  # Removed persist-credentials: false so the cherry-pick action can authenticate git push
                  token: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Cherry pick into release/0.1.x
              uses: carloscastrojumo/github-cherry-pick-action@09661c71f982ed876343b83dba9921b4b27a6679 # v1.0.1, pinned to commit SHA
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Scoped to this step only for least privilege
              with:
                  branch: release/0.1.x
                  labels: |
                      cherry-pick

    cherry_pick_release_0_2_x:
        runs-on: ubuntu-latest
        name: Cherry pick into release/0.2.x
        if: ${{ contains(github.event.pull_request.labels.*.name, 'release/0.2.x') && github.event.pull_request.merged == true }}
        steps:
            - name: Checkout code
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned commit SHA
              with:
                  fetch-depth: 0
                  # Removed persist-credentials: false so the cherry-pick action can authenticate git push
                  token: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Cherry pick into release/0.2.x
              uses: carloscastrojumo/github-cherry-pick-action@09661c71f982ed876343b83dba9921b4b27a6679 # v1.0.1, pinned to commit SHA
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Scoped to this step only for least privilege
              with:
                  branch: release/0.2.x
                  labels: |
                      cherry-pick
