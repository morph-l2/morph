name: Ops

on:
    push:
        branches:
            - main
        paths:
            - "build/**"
            - "node/ops-morph/**"
            - "ops/devnet-morph/**"
            - "ops/docker/**"
            - "ops/tools/**"
            - ".github/workflows/ops.yml"
    pull_request:
        paths:
            - "build/**"
            - "node/ops-morph/**"
            - "ops/devnet-morph/**"
            - "ops/docker/**"
            - "ops/tools/**"
            - ".github/workflows/ops.yml"

permissions:
    contents: read

jobs:
    go-lint:
        name: ops tools lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Go
              uses: actions/setup-go@v5
              with:
                  go-version: 1.24.x
            - name: Lint ops tools
              run: make -C ops/tools lint

    devnet-config:
        name: devnet config tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Run deterministic devnet tests
              run: python3 -m unittest discover -s ops/devnet-morph/tests -v
            - name: Validate Compose configuration
              working-directory: ops/docker
              run: >-
                  docker compose
                  -f docker-compose-devnet.yml
                  -f docker-compose-cluster.yml
                  config --quiet
