name: Contracts

on:
    push:
        branches:
            - main
        paths:
            - "build/**"
            - "contracts/**"
            - ".github/workflows/contracts.yml"
    pull_request:
        paths:
            - "build/**"
            - "contracts/**"
            - "ops/l2-genesis/**"
            - ".github/workflows/contracts.yml"

permissions:
    contents: read

defaults:
    run:
        working-directory: "contracts"

jobs:
    check:
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: 18.x
            - name: Install Go
              uses: actions/setup-go@v5
              with:
                  go-version: 1.24.x
            - name: Install Solhint
              run: npm install -g solhint
            - name: Lint Solidity
              run: make lint-sol
            - name: Lint Go
              run: make lint-go

    test:
        runs-on: ubuntu-latest
        env:
            FORCE_COLOR: 1
            GAS: true
        steps:
            - uses: actions/checkout@v4
            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: 18.x
            - name: Install Go
              uses: actions/setup-go@v5
              with:
                  go-version: 1.24.x
            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: nightly
            - name: Run build
              run: yarn && yarn build
            - name: Run tests
              run: yarn test
