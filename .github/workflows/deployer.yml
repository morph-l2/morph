name: Deployer

on:
    push:
        branches:
            - main
        paths:
            - "ops/**"
            - "contracts/**"
            - "Makefile"
            - ".github/workflows/deployer.yml"
    pull_request:
        paths:
            - "build/**"
            - "bindings/**"
            - "node/**"
            - "ops/**"
            - "contracts/**"
            - "Makefile"
            - ".github/workflows/deployer.yml"

permissions:
    contents: read

defaults:
    run:
        working-directory: "ops/l2-genesis"

jobs:
    check:
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Install Go
              uses: actions/setup-go@v5
              with:
                  go-version: 1.24.x
            - name: Lint
              run: |
                  rm -rf $HOME/.cache/golangci-lint
                  make lint
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Install Go
              uses: actions/setup-go@v5
              with:
                  go-version: 1.24.x
            - name: Verify operational commands, scripts and Go packages
              working-directory: .
              run: make ops-check
