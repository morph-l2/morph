[package]
version = "0.1.0"
name = "algebra-host"
edition = "2021"

[features]
default = []
sp1 = ["dep:sp1-sdk"]

[dependencies]
sp1-sdk = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
alloy-primitives = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "algebra-host"
path = "src/main.rs"
required-features = ["sp1"]
