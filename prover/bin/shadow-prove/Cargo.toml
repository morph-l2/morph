[package]
name = "shadow-proving"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
dotenv = { workspace = true }
env_logger = { workspace = true }
flexi_logger = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
prometheus = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
alloy-consensus = { workspace = true, default-features = false }
alloy-json-rpc = { workspace = true }
alloy-network = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true, default-features = false, features = [
    "reqwest",
    "reqwest-rustls-tls",
] }
alloy-rpc-types = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-contract = { workspace = true, default-features = false }
alloy-transport = { workspace = true }
alloy-transport-http = { workspace = true }
alloy-signer-local = { workspace = true }

prover-executor-host = { workspace = true }
prover-executor-client = { workspace = true }
prover-primitives = { workspace = true }
prover-utils.workspace = true
morph-primitives = { workspace = true }

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
