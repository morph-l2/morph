[package]
name = "morph-prove"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "prove"

[[bin]]
name = "prove"
path = "src/main.rs"

[[bin]]
name = "vkey"
path = "src/vkey.rs"

[dependencies]
sp1-sdk = { workspace = true }
sp1-verifier = { workspace = true }
anyhow.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
once_cell = { workspace = true }
alloy = { workspace = true }
dotenv = { workspace = true }
alloy-provider = { workspace = true }
alloy-primitives = { workspace = true }
# Must match the tonic version used by sp1-sdk, otherwise `downcast_ref::<tonic::Status>()`
# silently fails (see `NetworkFailure::classify`).
tonic = { version = "0.12.3", default-features = false, optional = true }

# workspace
prover-executor-host = { workspace = true }
prover-executor-client = { workspace = true }
prover-primitives = { workspace = true }
prover-utils = { workspace = true }


[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

[features]
default = ["network"]
local = ["sp1-sdk/native-gnark"]
network = ["sp1-sdk/network", "dep:tonic"]
