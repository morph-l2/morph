# reth does not read geth's static-nodes.json, so each execution client is
# handed its peers on the command line. Discovery is disabled, so --trusted-peers
# is the only thing wiring these nodes together.
#
# Every node is pointed at the same nodekey file geth mounts, via
# --p2p-secret-key, which makes its peer ID deterministic. Keep the two in sync:
# without the key file reth generates a fresh random identity for every new
# datadir, and no peer list could be written ahead of time. The enode public
# keys below are derived from those same files.
#
# Peering mirrors the geth static-nodes layout: morph-el-0 and morph-el-1 know
# only each other. The ha-el-* overrides live in docker-compose-cluster-reth.yml
# instead of here, because compose creates every service a later -f file names,
# so overrides parked in this file would also start in the non-cluster devnet,
# where the cluster's mounts are absent and those hostnames do not resolve.
#
# The command list is spelled out per service because --trusted-peers takes one
# comma separated value and YAML cannot concatenate an anchor with extra items.

x-reth-service: &reth-service
  image: ${MORPH_RETH_IMAGE:-ghcr.io/morph-l2/morph-reth:latest}
  user: "0:0"
  entrypoint:
    - ${MORPH_RETH_ENTRYPOINT:-/usr/local/bin/morph-reth}

services:
  morph-el-0:
    <<: *reth-service
    build: !reset null
    command:
      - node
      - --chain=/genesis.json
      - --datadir=/db
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=web3,debug,eth,txpool,net,trace,admin,reth
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=web3,debug,eth,txpool,net,trace,admin,reth
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/jwt-secret.txt
      - --nat=none
      - --disable-discovery
      - --p2p-secret-key=/p2p-secret.key
      - --trusted-peers=enode://bd755ce0bc8c06b4444b9013e8d1215a02e2b53f39f746f060c292ba2f6877d7b702374f006a49a7b1506bf1bc027b43824859d081283e6bac97c8600cdf3fee@morph-el-1:30303
    volumes:
      - "${PWD}/nodekey0:/p2p-secret.key"

  morph-el-1:
    <<: *reth-service
    command:
      - node
      - --chain=/genesis.json
      - --datadir=/db
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=web3,debug,eth,txpool,net,trace,admin,reth
      - --ws
      - --ws.addr=0.0.0.0
      - --ws.port=8546
      - --ws.api=web3,debug,eth,txpool,net,trace,admin,reth
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.jwtsecret=/jwt-secret.txt
      - --nat=none
      - --disable-discovery
      - --p2p-secret-key=/p2p-secret.key
      - --trusted-peers=enode://58e698ea2dd8a76e0cb185d13c1faabf223b60c89fef988c8b89496571056d6c2922109537bb291cd87f2ec09a23ac37d59bde2c7a4885d07b7b641cadff2921@morph-el-0:30303
    volumes:
      - "${PWD}/nodekey1:/p2p-secret.key"
